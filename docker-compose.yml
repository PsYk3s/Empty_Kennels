services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pb_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  server:
    build: .
    command: npm run dev:server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pb_app
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      BREVO_ENABLED: "false"
      ADMIN_NOTIFICATION_EMAIL: warrenb@pienaarbros.co.za
    ports: ["4000:4000"]
    depends_on: [db]
  web:
    build: .
    command: npm run dev:web -- --host
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [server]
